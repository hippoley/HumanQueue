name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: humanq --help
      - run: humanq onboard --help
      - run: humanq connect --help
      - run: humanq verify --help
      - run: humanq verify codex --json
      - run: humanq trust --help
      - run: humanq prove --help
      - run: humanq mcp --help
      - run: humanq channel --help
      - name: Verify README visual assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          readme = Path("README.md").read_text(encoding="utf-8")
          assets = [
              "docs/assets/human-boundary-hero.svg",
              "docs/assets/demo-surface.svg",
              "docs/assets/exact-resume.svg",
          ]
          for asset in assets:
              path = Path(asset)
              assert path.exists(), f"missing README asset: {asset}"
              assert asset in readme, f"README no longer references {asset}"
              ET.parse(path)

          assert "cd human-queue" not in readme, "README contains stale clone directory"
          assert 'href="https://hippoley.github.io/PAJ-Eval/human/"' in readme, "README lost clickable live-demo visual"
          assert "implemented + adapter tested" in readme
          assert "| **working** |" not in readme
          print("README visual assets verified")
          PY
      - name: Verify public demo source
        run: |
          python - <<'PY'
          from pathlib import Path

          demo = Path("docs/index.html").read_text(encoding="utf-8")
          assert "https://raw.githubusercontent.com/hippoley/HumanQueue/main/scripts/install.sh" in demo
          assert "hippoley/human:///" not in demo
          assert "https://github.com/hippoley/HumanQueue" in demo
          assert "Static demo · interactions stay in this browser" in demo
          for scenario in ("codex", "cursor", "mcp", "channel", "telegram"):
              assert f'?scenario={scenario}' in demo, f"missing shareable scenario: {scenario}"
          assert 'new URLSearchParams(location.search).get("scenario")' in demo
          assert 'native_resume=simulated' in demo
          assert 'native_resume=true' not in demo
          assert demo.count('class="journeyStep"') == 4
          assert demo.count('class="viewIntro"') >= 5
          assert 'scroll-snap-type:x proximity' in demo
          assert '.stats{display:none}' in demo
          assert 'flex-wrap:nowrap;overflow-x:auto' in demo
          assert 'reached a real human boundary' not in demo
          print("public demo source verified")
          PY
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Packaged first-run E2E
        run: |
          python -m venv /tmp/humanq-e2e-venv
          /tmp/humanq-e2e-venv/bin/python -m pip install --upgrade pip
          /tmp/humanq-e2e-venv/bin/python -m pip install dist/human_queue-*.whl
          cd /tmp
          /tmp/humanq-e2e-venv/bin/python "$GITHUB_WORKSPACE/scripts/first_run_e2e.py"
      - name: Packaged Gateway restart recovery E2E
        run: |
          cd /tmp
          /tmp/humanq-e2e-venv/bin/python "$GITHUB_WORKSPACE/scripts/gateway_restart_e2e.py"
      - name: Packaged Codex permission-hook E2E
        run: |
          cd /tmp
          /tmp/humanq-e2e-venv/bin/python "$GITHUB_WORKSPACE/scripts/codex_hook_e2e.py"
      - name: Packaged concurrent terminal E2E
        run: |
          cd /tmp
          /tmp/humanq-e2e-venv/bin/python "$GITHUB_WORKSPACE/scripts/concurrent_terminal_e2e.py"
      - name: Packaged idempotent retry E2E
        run: |
          cd /tmp
          /tmp/humanq-e2e-venv/bin/python "$GITHUB_WORKSPACE/scripts/idempotent_retry_e2e.py"
      - name: Packaged multi-worker idempotent create E2E
        run: |
          cd /tmp
          /tmp/humanq-e2e-venv/bin/python "$GITHUB_WORKSPACE/scripts/multiworker_idempotent_create_e2e.py"
      - name: Packaged channel outbox recovery E2E
        run: |
          cd /tmp
          /tmp/humanq-e2e-venv/bin/python "$GITHUB_WORKSPACE/scripts/channel_outbox_recovery_e2e.py"
      - name: Verify packaged runtime assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("human_queue-*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          required = {
              "app/web/index.html",
              "humanqueue/assets/opencode-human-queue.ts",
              "humanqueue/connectors/opencode.py",
              "humanqueue/connectors/claude.py",
              "humanqueue/channels/telegram.py",
              "humanqueue/channels/slack.py",
          }
          missing = sorted(required - names)
          assert not missing, f"wheel is missing runtime assets: {missing}"
          print(f"verified {wheels[0]} with {len(required)} required runtime assets")
          PY


  packaged-first-run-matrix:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: packaged first-run (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build clean wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Create clean smoke venv
        run: python -m venv .smoke-venv
      - name: Install built wheel (Unix)
        if: runner.os != 'Windows'
        run: .smoke-venv/bin/python -m pip install dist/human_queue-*.whl
      - name: Install built wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\human_queue-*.whl | Select-Object -First 1
          .\.smoke-venv\Scripts\python.exe -m pip install $wheel.FullName
      - name: Run real packaged first-run (Unix)
        if: runner.os != 'Windows'
        run: |
          cd ${{ runner.temp }}
          "$GITHUB_WORKSPACE/.smoke-venv/bin/python" "$GITHUB_WORKSPACE/scripts/first_run_e2e.py"
          "$GITHUB_WORKSPACE/.smoke-venv/bin/python" "$GITHUB_WORKSPACE/scripts/gateway_restart_e2e.py"
      - name: Run real packaged first-run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\.smoke-venv\Scripts\python.exe" "$env:GITHUB_WORKSPACE\scripts\first_run_e2e.py"
          & "$env:GITHUB_WORKSPACE\.smoke-venv\Scripts\python.exe" "$env:GITHUB_WORKSPACE\scripts\gateway_restart_e2e.py"


  installer-entrypoint-matrix:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: installer entrypoint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run install.sh twice and preserve existing state
        if: runner.os != 'Windows'
        env:
          HUMAN_QUEUE_HOME: ${{ runner.temp }}/humanq-installer-state
        run: |
          bash scripts/install.sh
          "$HOME/.local/bin/humanq" doctor
          test -f "$HUMAN_QUEUE_HOME/config.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          home = Path(os.environ["HUMAN_QUEUE_HOME"])
          cfg = json.loads((home / "config.json").read_text())
          assert str(cfg["token"]).startswith("hq_")
          (home / "token-before.txt").write_text(cfg["token"])
          (home / "upgrade-sentinel.txt").write_text("preserve-me")
          print("INSTALLER_FIRST_PASS_OK")
          PY

          bash scripts/install.sh
          "$HOME/.local/bin/humanq" doctor

          python - <<'PY'
          import json, os
          from pathlib import Path
          home = Path(os.environ["HUMAN_QUEUE_HOME"])
          cfg = json.loads((home / "config.json").read_text())
          token_before = (home / "token-before.txt").read_text()
          assert cfg["token"] == token_before, (cfg["token"], token_before)
          assert (home / "upgrade-sentinel.txt").read_text() == "preserve-me"
          print("INSTALLER_REINSTALL_PRESERVES_STATE_OK")
          PY
      - name: Run install.ps1 twice and preserve existing state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HUMAN_QUEUE_HOME = Join-Path $env:RUNNER_TEMP "humanq-installer-state"
          .\scripts\install.ps1
          $humanq = Join-Path $env:HUMAN_QUEUE_HOME "runtime\Scripts\humanq.exe"
          & $humanq doctor
          if (-not (Test-Path (Join-Path $env:HUMAN_QUEUE_HOME "config.json"))) {
            throw "installer did not create config.json"
          }

          $cfg = Get-Content (Join-Path $env:HUMAN_QUEUE_HOME "config.json") | ConvertFrom-Json
          if (-not $cfg.token.StartsWith("hq_")) {
            throw "installer did not create a valid gateway token"
          }
          Set-Content -Path (Join-Path $env:HUMAN_QUEUE_HOME "token-before.txt") -Value $cfg.token -NoNewline
          Set-Content -Path (Join-Path $env:HUMAN_QUEUE_HOME "upgrade-sentinel.txt") -Value "preserve-me" -NoNewline
          Write-Host "INSTALLER_FIRST_PASS_OK"

          .\scripts\install.ps1
          & $humanq doctor

          $cfgAfter = Get-Content (Join-Path $env:HUMAN_QUEUE_HOME "config.json") | ConvertFrom-Json
          $tokenBefore = Get-Content (Join-Path $env:HUMAN_QUEUE_HOME "token-before.txt") -Raw
          $sentinel = Get-Content (Join-Path $env:HUMAN_QUEUE_HOME "upgrade-sentinel.txt") -Raw
          if ($cfgAfter.token -ne $tokenBefore) {
            throw "reinstall rotated the existing gateway token"
          }
          if ($sentinel -ne "preserve-me") {
            throw "reinstall destroyed existing human:// state"
          }
          Write-Host "INSTALLER_REINSTALL_PRESERVES_STATE_OK"


  codex-native-discovery:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: latest Codex native hook discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install latest official Codex CLI
        run: |
          npm install -g @openai/codex@latest
          codex --version
      - name: Install human:// and connect Codex
        run: |
          python -m pip install .
          humanq onboard --force
          humanq connect codex
      - name: Prove Codex-native discovery and explicit trust
        run: |
          humanq gateway run > humanq-gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill "$GATEWAY_PID" >/dev/null 2>&1 || true' EXIT

          python - <<'PY'
          import json
          import time
          import urllib.request

          deadline = time.monotonic() + 10
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:7482/health", timeout=1) as r:
                      if json.load(r).get("ok") is True:
                          break
              except Exception:
                  time.sleep(0.1)
          else:
              raise SystemExit("Gateway did not become healthy")
          PY

          humanq verify codex --json > codex-readiness-before.json
          cat codex-readiness-before.json
          humanq trust codex --json > codex-trust.json
          cat codex-trust.json
          humanq verify codex --json > codex-readiness-after.json
          cat codex-readiness-after.json

          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path("codex-readiness-before.json").read_text())
          trust = json.loads(Path("codex-trust.json").read_text())
          after = json.loads(Path("codex-readiness-after.json").read_text())

          assert before["codex_detected"] is True, before
          assert before["codex_version"], before
          assert before["hooks_file_present"] is True, before
          assert before["permission_hook_present"] is True, before
          assert before["hook_command_matches_current_runtime"] is True, before
          assert sorted(before["observer_events_present"]) == sorted([
              "PreToolUse", "PostToolUse", "SessionStart",
              "UserPromptSubmit", "Stop", "SessionEnd",
          ]), before
          assert before["native_hook_discovered"] is True, before
          assert before["native_current_hash"], before
          assert before["native_timeout_sec"] == 600, before
          assert before["native_status_message"] == "Waiting for human://", before
          assert before["trust_status"] in {"untrusted", "modified", "trusted", "managed"}, before

          assert trust["current_hash"] == before["native_current_hash"], (trust, before)
          assert trust["trust_after"] in {"trusted", "managed"}, trust

          assert after["native_hook_discovered"] is True, after
          assert after["native_current_hash"] == before["native_current_hash"], (after, before)
          assert after["trust_status"] in {"trusted", "managed"}, after
          assert after["gateway_online"] is True, after
          assert after["ready_for_real_host_probe"] is True, after
          assert after["real_host_e2e_verified"] is False, after

          print("CODEX_NATIVE_DISCOVERY_AND_TRUST_OK")
          print("codex_version=" + str(after["codex_version"]))
          print("trust_before=" + str(before["trust_status"]))
          print("trust_after=" + str(after["trust_status"]))
          print("hook_hash=" + str(after["native_current_hash"]))
          PY

          python -m venv .codex-upgrade-venv
          .codex-upgrade-venv/bin/python -m pip install .
          .codex-upgrade-venv/bin/humanq connect codex
          .codex-upgrade-venv/bin/humanq verify codex --json > codex-runtime-moved.json
          cat codex-runtime-moved.json

          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path("codex-readiness-after.json").read_text())
          moved = json.loads(Path("codex-runtime-moved.json").read_text())

          assert moved["hook_command_matches_current_runtime"] is True, moved
          assert moved["native_hook_discovered"] is True, moved
          assert moved["native_current_hash"], moved
          assert moved["native_current_hash"] != before["native_current_hash"], (before, moved)
          assert moved["trust_status"] in {"untrusted", "modified"}, moved
          assert moved["ready_for_real_host_probe"] is False, moved
          print("CODEX_RUNTIME_MOVE_INVALIDATES_TRUST_OK")
          print("old_hash=" + str(before["native_current_hash"]))
          print("new_hash=" + str(moved["native_current_hash"]))
          print("trust_after_runtime_move=" + str(moved["trust_status"]))
          PY

          .codex-upgrade-venv/bin/humanq trust codex --json > codex-runtime-moved-trust.json
          .codex-upgrade-venv/bin/humanq verify codex --json > codex-runtime-moved-after.json
          cat codex-runtime-moved-trust.json
          cat codex-runtime-moved-after.json

          python - <<'PY'
          import json
          from pathlib import Path

          trust = json.loads(Path("codex-runtime-moved-trust.json").read_text())
          after = json.loads(Path("codex-runtime-moved-after.json").read_text())

          assert trust["trust_before"] in {"untrusted", "modified"}, trust
          assert trust["trust_after"] in {"trusted", "managed"}, trust
          assert after["trust_status"] in {"trusted", "managed"}, after
          assert after["ready_for_real_host_probe"] is True, after
          print("CODEX_RUNTIME_MOVE_RETRUST_OK")
          PY
