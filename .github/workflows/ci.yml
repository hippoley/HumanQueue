name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: humanq --help
      - run: humanq onboard --help
      - run: humanq connect --help
      - run: humanq mcp --help
      - run: humanq channel --help
      - name: Verify README visual assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          readme = Path("README.md").read_text(encoding="utf-8")
          assets = [
              "docs/assets/human-boundary-hero.svg",
              "docs/assets/demo-surface.svg",
              "docs/assets/exact-resume.svg",
          ]
          for asset in assets:
              path = Path(asset)
              assert path.exists(), f"missing README asset: {asset}"
              assert asset in readme, f"README no longer references {asset}"
              ET.parse(path)

          assert "cd human-queue" not in readme, "README contains stale clone directory"
          assert 'href="https://hippoley.github.io/PAJ-Eval/human/"' in readme, "README lost clickable live-demo visual"
          print("README visual assets verified")
          PY
      - name: Verify public demo source
        run: |
          python - <<'PY'
          from pathlib import Path

          demo = Path("docs/index.html").read_text(encoding="utf-8")
          assert "https://raw.githubusercontent.com/hippoley/HumanQueue/main/scripts/install.sh" in demo
          assert "hippoley/human:///" not in demo
          assert "https://github.com/hippoley/HumanQueue" in demo
          assert "Static demo · interactions stay in this browser" in demo
          print("public demo source verified")
          PY
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Verify packaged runtime assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("human_queue-*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          required = {
              "app/web/index.html",
              "humanqueue/assets/opencode-human-queue.ts",
              "humanqueue/connectors/opencode.py",
              "humanqueue/connectors/claude.py",
              "humanqueue/channels/telegram.py",
              "humanqueue/channels/slack.py",
          }
          missing = sorted(required - names)
          assert not missing, f"wheel is missing runtime assets: {missing}"
          print(f"verified {wheels[0]} with {len(required)} required runtime assets")
          PY
