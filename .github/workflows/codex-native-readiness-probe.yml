name: codex native readiness probe

on:
  push:
    branches:
      - codex-native-readiness

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install official Codex CLI and human://
        run: |
          npm install -g @openai/codex@latest
          codex --version
          python -m pip install .
      - name: Initialize Gateway and install Codex hooks
        run: |
          humanq onboard --force
          humanq connect codex
          humanq gateway run > /tmp/humanq-gateway.log 2>&1 &
          echo $! > /tmp/humanq-gateway.pid
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:7482/health; then break; fi
            sleep .2
          done
      - name: Verify before native trust
        run: |
          humanq verify codex --json | tee /tmp/before.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/before.json'))
          assert x['native_hook_discovered'] is True, x
          assert x['trust_status'] in ('untrusted','modified'), x
          assert x['ready_for_real_host_probe'] is False, x
          print('HUMANQ_VERIFY_CODEX_UNTRUSTED_OK')
          PY
      - name: Trust through real Codex app-server
        run: python scripts/codex_appserver_probe.py
      - name: Verify after native trust
        run: |
          humanq verify codex --json | tee /tmp/after.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/after.json'))
          assert x['native_hook_discovered'] is True, x
          assert x['trust_status'] in ('trusted','managed'), x
          assert x['native_current_hash'], x
          assert x['ready_for_real_host_probe'] is True, x
          assert x['real_host_e2e_verified'] is False, x
          print('HUMANQ_VERIFY_CODEX_TRUSTED_OK')
          PY
      - name: Cleanup
        if: always()
        run: |
          cat /tmp/humanq-gateway.log || true
          if [ -f /tmp/humanq-gateway.pid ]; then kill "$(cat /tmp/humanq-gateway.pid)" || true; fi
