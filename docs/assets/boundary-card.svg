<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">A human:// decision card and exact resume receipt</title>
<desc id="desc">An example human boundary showing why an agent stopped, context, approve and reject controls, and the exact source session that resumed.</desc>
<style>
  .bg{fill:#11120f}.panel{fill:#191a17;stroke:#35372f;stroke-width:1.5}.sub{fill:#242620}.ink{fill:#f7f4ed}.muted{fill:#a8a49a}.lime{fill:#d7ff63}.orange{fill:#ff6647}.good{fill:#89dcad}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
</style>
<rect width="1200" height="480" rx="28" class="bg"/>
<text x="48" y="54" class="mono muted" font-size="14" letter-spacing="2">WHAT THE HUMAN ACTUALLY NEEDS TO SEE</text>

<g transform="translate(48 86)">
  <rect width="760" height="342" rx="22" class="panel"/>
  <rect x="22" y="22" width="138" height="34" rx="9" class="lime"/>
  <text x="37" y="45" class="mono" fill="#141510" font-size="17" font-weight="800">human://approve</text>
  <text x="584" y="44" class="mono orange" font-size="13">blocked 43s</text>
  <text x="22" y="92" class="sans ink" font-size="29" font-weight="780">Modify production Terraform state?</text>
  <text x="22" y="123" class="mono muted" font-size="13">claude / worker-8 / session-91 / tool-14</text>
  <rect x="22" y="149" width="716" height="86" rx="14" class="sub"/>
  <text x="40" y="177" class="mono muted" font-size="12">WHY IT STOPPED</text>
  <text x="40" y="203" class="sans ink" font-size="15">terraform plan will replace 2 production resources.</text>
  <text x="40" y="224" class="sans muted" font-size="14">Last context: “plan completed, 2 to replace, 0 to add.”</text>

  <rect x="22" y="258" width="142" height="48" rx="11" fill="none" stroke="#65675f"/>
  <text x="65" y="288" class="sans ink" font-size="14" font-weight="700">inspect</text>
  <rect x="178" y="258" width="142" height="48" rx="11" fill="none" stroke="#a64a3a"/>
  <text x="223" y="288" class="sans" fill="#ff8f79" font-size="14" font-weight="700">reject</text>
  <rect x="334" y="258" width="142" height="48" rx="11" class="lime"/>
  <text x="374" y="288" class="sans" fill="#11120f" font-size="14" font-weight="800">approve</text>
  <text x="530" y="288" class="mono muted" font-size="12">resolver: slack:U123</text>
</g>

<g transform="translate(842 126)">
  <text x="0" y="0" class="mono muted" font-size="12">AFTER THE CLICK</text>
  <rect y="22" width="310" height="92" rx="16" class="panel"/>
  <circle cx="27" cy="48" r="7" class="good"/>
  <text x="46" y="53" class="sans ink" font-size="16" font-weight="700">decision recorded</text>
  <text x="22" y="82" class="mono muted" font-size="12">request_id attn_83f…</text>
  <text x="22" y="101" class="mono muted" font-size="12">action approve</text>

  <path d="M155 114 L155 146" stroke="#62655d" stroke-width="2"/>
  <path d="M149 140 L155 148 L161 140" fill="none" stroke="#62655d" stroke-width="2"/>
  <rect y="148" width="310" height="92" rx="16" class="panel"/>
  <circle cx="27" cy="174" r="7" class="good"/>
  <text x="46" y="179" class="sans ink" font-size="16" font-weight="700">exact target resumed</text>
  <text x="22" y="208" class="mono muted" font-size="12">session-91 / tool-14</text>
  <text x="22" y="227" class="mono muted" font-size="12">same request id ✓</text>

  <rect y="266" width="310" height="58" rx="14" class="lime"/>
  <text x="27" y="301" class="mono" fill="#11120f" font-size="14" font-weight="800">resume_confirmed ✓</text>
</g>
</svg>