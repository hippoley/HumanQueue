<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">human:// human-boundary control plane</title>
<desc id="desc">Multiple autonomous agents converge on a human boundary, reach a human decision surface, then resume the exact waiting execution.</desc>
<style>
  .bg{fill:#f6f3ec}.panel{fill:#fffdf8;stroke:#d8d2c7;stroke-width:1.5}.ink{fill:#171715}.muted{fill:#6e6960}.lime{fill:#d7ff63}.orange{fill:#ff6647}.line{stroke:#9d978e;stroke-width:2;fill:none}.dash{stroke-dasharray:7 8}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){.bg{fill:#0f100e}.panel{fill:#171815;stroke:#34372f}.ink{fill:#f1efe9}.muted{fill:#aaa69d}.line{stroke:#60655a}}
</style>
<rect class="bg" width="1200" height="520" rx="28"/>
<text x="58" y="64" class="mono muted" font-size="15" letter-spacing="2">AUTONOMOUS WORK CROSSES A HUMAN BOUNDARY</text>

<g transform="translate(58 112)">
  <rect class="panel" width="268" height="78" rx="16"/>
  <circle cx="28" cy="25" r="7" class="orange"/>
  <text x="48" y="31" class="sans ink" font-size="18" font-weight="700">Claude / worker-8</text>
  <text x="28" y="58" class="mono muted" font-size="13">session-91 · tool-14 · paused</text>
</g>
<g transform="translate(58 214)">
  <rect class="panel" width="268" height="78" rx="16"/>
  <circle cx="28" cy="25" r="7" class="orange"/>
  <text x="48" y="31" class="sans ink" font-size="18" font-weight="700">Codex / agent-17</text>
  <text x="28" y="58" class="mono muted" font-size="13">turn-31 · PermissionRequest</text>
</g>
<g transform="translate(58 316)">
  <rect class="panel" width="268" height="78" rx="16"/>
  <circle cx="28" cy="25" r="7" class="orange"/>
  <text x="48" y="31" class="sans ink" font-size="18" font-weight="700">MCP / research-agent</text>
  <text x="28" y="58" class="mono muted" font-size="13">run-218 · clarification</text>
</g>

<path d="M326 151 C380 151 398 206 447 206" class="line"/>
<path d="M326 253 C382 253 397 253 447 253" class="line"/>
<path d="M326 355 C380 355 398 301 447 301" class="line"/>

<g transform="translate(447 141)">
  <rect width="306" height="224" rx="24" class="ink"/>
  <rect x="18" y="18" width="118" height="35" rx="9" class="lime"/>
  <text x="32" y="42" class="mono" fill="#141510" font-size="19" font-weight="800">human://</text>
  <text x="20" y="87" class="sans" fill="#f6f3ec" font-size="20" font-weight="700">HumanBoundary</text>
  <text x="20" y="118" class="mono" fill="#b7b4ab" font-size="13">identity + bounded context</text>
  <text x="20" y="146" class="mono" fill="#b7b4ab" font-size="13">authorized resolver</text>
  <text x="20" y="174" class="mono" fill="#b7b4ab" font-size="13">expiry + supersession</text>
  <text x="20" y="202" class="mono" fill="#b7b4ab" font-size="13">native resume handle</text>
</g>

<path d="M753 253 C806 253 818 253 858 253" class="line"/>
<g transform="translate(858 158)">
  <rect class="panel" width="284" height="190" rx="20"/>
  <text x="22" y="34" class="mono muted" font-size="13">RIGHT HUMAN · RIGHT SURFACE</text>
  <text x="22" y="70" class="sans ink" font-size="22" font-weight="750">Deploy to production?</text>
  <text x="22" y="101" class="sans muted" font-size="14">2 resources will be replaced.</text>
  <rect x="22" y="127" width="72" height="38" rx="9" fill="none" stroke="#a5a096"/>
  <text x="41" y="151" class="sans ink" font-size="13" font-weight="700">inspect</text>
  <rect x="104" y="127" width="70" height="38" rx="9" fill="none" stroke="#e49381"/>
  <text x="122" y="151" class="sans" fill="#b8422d" font-size="13" font-weight="700">reject</text>
  <rect x="184" y="127" width="78" height="38" rx="9" class="ink"/>
  <text x="201" y="151" class="sans" fill="#fff" font-size="13" font-weight="700">approve</text>
</g>

<path d="M1000 348 C1000 420 795 443 628 420" class="line dash"/>
<path d="M628 420 L642 412 M628 420 L642 428" class="line"/>
<text x="744" y="456" class="mono muted" font-size="13">decision → exact waiting action → resume receipt</text>
<rect x="467" y="397" width="172" height="42" rx="10" class="lime"/>
<text x="487" y="423" class="mono" fill="#141510" font-size="13" font-weight="800">resume confirmed ✓</text>
</svg>