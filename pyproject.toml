[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-queue"
version = "0.6.0"
description = "Self-hosted control plane for routing human decisions back to the exact paused agent."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "slack-sdk>=3.36",
]
keywords = ["agents", "human-in-the-loop", "approvals", "control-plane", "mcp"]

[project.urls]
Homepage = "https://github.com/hippoley/HumanQueue"
Repository = "https://github.com/hippoley/HumanQueue"
Documentation = "https://github.com/hippoley/HumanQueue#readme"
"Issue Tracker" = "https://github.com/hippoley/HumanQueue/issues"

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
humanq = "humanqueue.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "humanqueue*"]

[tool.setuptools.package-data]
app = ["web/*.html"]
humanqueue = ["assets/*.ts"]
